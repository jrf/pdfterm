[package]
name = "pdfterm"
version = "0.1.0"
edition = "2024"
description = "A low-latency PDF viewer for Kitty terminals"
license = "MIT"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
crossbeam-channel = "0.5.15"
flate2 = "1.1.9"
nucleo-matcher = "0.3.1"
pdfium-render = { version = "0.9.3", default-features = false, features = ["pdfium_latest", "thread_safe"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.8.23"

[build-dependencies]
flate2 = "1.1.9"
sha2 = "0.11.0"
tar = "0.4.46"
ureq = { version = "3.3.0", default-features = false, features = ["platform-verifier", "rustls"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "pdfterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/jrf/pdfterm"
description = "A low-latency PDF viewer for Kitty terminals"
license = "MIT"

[dependencies]
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
crossbeam-channel = "0.5.15"
libc = "0.2"
getrandom = "0.4.3"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
nucleo-matcher = "0.3.1"
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
synctex-parser = { git = "https://github.com/DavidLapous/synctex-parser", rev = "0271f6a08afa1c24669307d3dedde45a05b0d482" }
thiserror = "2.0.17"
png = "0.18.0"
fontdb = "0.24.0"
fontdue = "0.9.4"
toml = "1.1.6"
unicode-normalization = "0.1.24"

[build-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
sha2 = "0.11.0"
tar = "0.4.46"
ureq = { version = "3.3.0", default-features = false, features = ["platform-verifier", "rustls"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
